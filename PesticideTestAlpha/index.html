
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攝像頭顏色分析</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>農藥抑制率分析</h1>
    <div id="version" class="version-display">版本號: v1.1.1</div>
    <div class="container">
        <button id="startBtn">啟動攝像頭</button>
        <video id="camera" autoplay playsinline webkit-playsinline></video>

        <div id="redBox1" class="redBox"><span class="boxLabel">空白組</span></div>
        <div id="redBox2" class="redBox"><span class="boxLabel">樣品組</span></div>

        <button id="analyzeBtn">分析</button>
        <button id="stopBtn">提前結束</button>
        <p id="result">RGB: (R, G, B)</p>
        <canvas id="blueChart" width="400" height="200"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
