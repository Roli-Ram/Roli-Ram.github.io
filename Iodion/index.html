<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攝像頭顏色分析</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
</head>
<body>
    <h1>碘液顏色分析定量</h1>
    <div id="version" class="version-display">版本號: v1.3.0</div>
    <div class="container">
        <video id="camera" autoplay></video>

        <!-- 紅框1 -->
        <div id="redBox1" class="redBox">
            <span class="boxLabel">樣品 1</span>
        </div>
        <!-- 紅框2 -->
        <div id="redBox2" class="redBox">
            <span class="boxLabel">樣品 2</span>
        </div>
        <!-- 紅框3 -->
        <div id="redBox3" class="redBox">
            <span class="boxLabel">樣品 3</span>
        </div>

        <button id="analyzeBtn">分析</button>
        <button id="stopBtn">提前結束</button>
        <p id="result">RGB: (R, G, B)</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
